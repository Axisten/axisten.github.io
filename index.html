<!DOCTYPE html>
<html lang="ru">
<head> <meta name="yandex-verification" content="3f258b5687c7f48f" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры от студии Axisten</title>
    <!-- Favicon -->
    <link rel="icon" href="IconForIndex.png" type="image/png">
    <link rel="apple-touch-icon" href="IconForIndex.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('GameBackGround.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        header {
            text-align: center;
            padding: 0;
            background: transparent;
            width: 100%;
            line-height: 0;
        }
        header .header-logo {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
        }
        .main-wrapper {
            flex: 1;
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0;
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 600px;
            margin: 0;
        }
        .game-card {
            background: rgba(80, 20, 30, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(180, 60, 70, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-decoration: none;
            display: block;
            color: #fff;
        }
        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(100, 30, 40, 0.7);
            box-shadow: 0 14px 48px rgba(0,0,0,0.6);
            border-color: rgba(200, 80, 90, 0.3);
        }
        .game-avatar-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.2);
        }
        .game-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .game-card:hover .game-avatar {
            transform: scale(1.04);
        }
        .game-card h3 {
            font-size: 1.5em;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .game-card .description {
            font-size: 0.9em;
            opacity: 0.95;
            padding: 0 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        footer {
            text-align: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(2px);
            margin-top: auto;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
            font-size: 0.9em;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        @media (max-width: 768px) {
            .main-wrapper {
                padding: 20px 16px;
                justify-content: center;
            }
            .games-grid {
                max-width: 100%;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- Логотип касается краев сайта -->
        <img src="UpDownIcon.png" alt="Axisten Studio Logo" class="header-logo">
    </header>

    <main class="main-wrapper">
        <div class="games-grid" id="gamesGrid">
            <!-- Карточка игры "Змейка" — ссылка на указанный URL -->
            <a href="https://axisten.github.io/AxelGames/" class="game-card" target="_blank">
                <div class="game-avatar-wrapper">
                    <img src="SnakyAvatar.png" alt="Змейка" class="game-avatar">
                </div>
                <h3>Змейка</h3>
                <div class="description">ищите еду и становитесь длиннее</div>
            </a>
        </div>
    </main>

    <footer>
        <p>© 2026 Игры от студии Axisten</p>
    </footer>
</body>
</html>
