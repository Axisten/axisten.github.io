<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- === ГЛАВНЫЙ МЕТА-ТЕГ ДЛЯ ЯНДЕКСА === -->
    <meta name="yandex-verification" content="3f258b5687c7f48f" />
    <!-- ====================================== -->

    <title>Games by Axisten Studio</title>
    <style>
        /* Базовые стили для красивой страницы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; /* Темный фон как у космоса */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            margin-top: 15px;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 1.1em;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: #f5576c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }
        .status-check {
            margin-top: 20px;
            font-size: 0.9em;
            color: #64748b;
        }
        .status-check span {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Games By Axisten Studio</h1>
        <p>Добро пожаловать! Здесь скоро появятся мои игры.<br>
        Сейчас сайт находится в стадии настройки.</p>
        
        <!-- Кнопка перехода на основную страницу с играми -->
        <a href="https://axisten.github.io/GameByAxistenStudio/" class="btn">Перейти к моим играм →</a>
        
        <div class="status-check">
            Статус: <span>Проверка Яндекс.Вебмастер активна</span>
        </div>
    </div>

</body>
</html>
